name: Windows
on: 
  # Workflow is triggered when pushing code.
  push:
    paths:
      - '*.pro'
      - '**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.pro'
      - '**'
      - '.github/workflows/windows.yml' 
jobs:
  build:
    name: Build
    # The operating platform, currently Windows Server 2022.
    runs-on: windows-2022
    strategy:
      # Matrix configuration
      matrix:
        include:
          # 5.15.2 reference https://tencent.com
          - qt_ver: 5.15.2          
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
            qt_arch_install: msvc2019_64          
          
    env:
      targetName: OCAuxiliaryTools.exe
      VERSION: Win64
      orgName: OCAT
      
    # step
    steps:
      # Install Qt
      - name: Install Qt
        # Обновлено до v4 (поддерживает новые версии Node)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cached: 'false'

      # Pull code
      # Обновлено до v4 (избавляет от предупреждений Node 16/20)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Dynamically obtain VS path
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # MSVC compilation
      - name: msvc-build
        id: build
        shell: cmd
        run: |
          qmake
          nmake
          echo winSdkDir=%WindowsSdkDir% >> %GITHUB_ENV%
          echo winSdkVer=%WindowsSdkVersion% >> %GITHUB_ENV%
          echo vcToolsInstallDir=%VCToolsInstallDir% >> %GITHUB_ENV%
          echo vcToolsRedistDir=%VCToolsRedistDir% >> %GITHUB_ENV%

      # Pack 
      - name: package
        id: package      
        env:
          archiveName: ${{ env.orgName }}-${{ env.VERSION }}
          msvcArch: ${{ matrix.msvc_arch }}          
        shell: pwsh
        run: |
          & scripts\windows-publish.ps1 ${env:archiveName} ${env:targetName}
          # Исправлен устаревший синтаксис ::set-output на современный GITHUB_OUTPUT
          echo "packageName=${env:archiveName}" >> $env:GITHUB_OUTPUT
          
      # Upload artifacts          
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.packageName }}
          path: ${{ steps.package.outputs.packageName }}.zip
          
      # tag Upload Release
      - name: uploadRelease
        if: startsWith(github.event.ref, 'refs/tags/')
        # Обновлено до v3 для стабильной работы на Node 20/24
        uses: svenstaro/upload-release-action@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.package.outputs.packageName }}.zip
          asset_name: ${{ steps.package.outputs.packageName }}.zip
          tag: ${{ github.ref }}
          overwrite: true
