name: Refactor OCAuxiliaryTools
on:
  workflow_dispatch:
  push:
    branches: [refactor/remove-database-presets]
jobs:
  refactor:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/remove-database-presets
      - name: Apply refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          def text(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)

          # Remove Database/Presets source assets.
          for p in [root/'src/dlgdatabase.cpp',root/'src/dlgdatabase.h',root/'src/dlgdatabase.ui',
                    root/'src/dlgPreset.cpp',root/'src/dlgPreset.h',root/'src/dlgPreset.ui']:
              if p.exists(): p.unlink()
          db=root/'Database'
          if db.exists():
              import shutil; shutil.rmtree(db)

          # Project file: remove deleted units.
          p=root/'OCAuxiliaryTools.pro'; s=text(p)
          for name in ['src/dlgPreset.cpp','src/dlgdatabase.cpp','src/dlgPreset.h','src/dlgdatabase.h','src/dlgPreset.ui','src/dlgdatabase.ui']:
              s=s.replace('    '+name+' \\\n','')
              s=s.replace('    '+name+'\n','')
          write(p,s)

          # Preferences/default: make Auto Column Width false where persisted default is declared.
          for p in [root/'src/dlgpreference.cpp',root/'src/mainwindow.cpp']:
              s=text(p)
              s=re.sub(r'(Auto.?Column.?Width[^\n]{0,160}?setChecked\()true(\))',r'\\1false\\2',s,flags=re.I)
              s=re.sub(r'(Auto.?Column.?Width[^\n]{0,160}?=\\s*)true\\b',r'\\1false',s,flags=re.I)
              write(p,s)

          # Header: remove database/preset members, includes, and obsolete action slots.
          p=root/'src/mainwindow.h'; s=text(p)
          s=re.sub(r'^#include "dlgPreset.h"\n','',s,flags=re.M)
          s=re.sub(r'^#include "dlgdatabase.h"\n','',s,flags=re.M)
          s=re.sub(r'^#include "ui_dlgPreset.h"\n','',s,flags=re.M)
          s=re.sub(r'^#include "ui_dlgdatabase.h"\n','',s,flags=re.M)
          s=re.sub(r'^\\s*QString dataBaseDir, userDataBaseDir;\n','',s,flags=re.M)
          s=re.sub(r'^\\s*QString getDatabaseVer\(\);\n','',s,flags=re.M)
          s=re.sub(r'^\\s*dlgDatabase\\* myDatabase;\n','',s,flags=re.M)
          s=re.sub(r'^\\s*dlgPreset\\* dlgPresetValues;\n','',s,flags=re.M)
          s=re.sub(r'^\\s*void ShowAutoUpdateDlg\(bool Database\);\n','',s,flags=re.M)
          for fn in ['on_actionDatabase_triggered','on_actionGenerateEFI_triggered']:
              s=re.sub(r'^\\s*void '+fn+r'\(\);\n','',s,flags=re.M)
          write(p,s)

          # Main window C++: remove includes and database/preset/new-EFI handlers.
          p=root/'src/mainwindow.cpp'; s=text(p)
          s=s.replace('#include "dlgdatabase.h"\n','').replace('#include "dlgPreset.h"\n','')
          # Delete complete free-standing functions by signature and balanced braces.
          def remove_func(src, signature):
              pos=src.find(signature)
              while pos>=0:
                  brace=src.find('{',pos)
                  if brace<0: break
                  depth=0; i=brace
                  while i<len(src):
                      if src[i]=='{': depth+=1
                      elif src[i]=='}':
                          depth-=1
                          if depth==0:
                              return src[:pos]+src[i+1:]
                      i+=1
                  break
              return src
          for sig in ['void MainWindow::on_actionDatabase_triggered()',
                      'void MainWindow::on_actionGenerateEFI_triggered()',
                      'QString MainWindow::getDatabaseVer()']:
              s=remove_func(s,sig)
          # Remove direct database directory initialization and stale member references.
          s=re.sub(r'^\\s*dataBaseDir\\s*=.*;\n','',s,flags=re.M)
          s=re.sub(r'^\\s*userDataBaseDir\\s*=.*;\n','',s,flags=re.M)
          # Database-only update UI calls: keep generic update dialog invocation out.
          s=s.replace('ShowAutoUpdateDlg(true);','')
          write(p,s)

          # Mainwindow UI: remove database/preset/generate-EFI actions and their menu references.
          p=root/'src/mainwindow.ui'; s=text(p)
          for obj in ['actionDatabase','actionGenerateEFI','actionPreset','actionPresets','actionGenerate_EFI']:
              s=re.sub(r'<action[^>]*>\\s*<property name="objectName">\\s*<cstring>'+re.escape(obj)+r'</cstring>\\s*</property>.*?</action>', '', s, flags=re.S)
              s=re.sub(r'<addaction name="'+re.escape(obj)+r'"/>\\s*','',s)
          write(p,s)

          # Remove old OpenCore versions from the version selector, retaining >= 1.0.5.
          p=root/'src/syncocdialog.cpp'; s=text(p)
          s=re.sub(r'^(.*(?:OpenCore|ocVersion|version).*(?:0\\.[0-9]+|1\\.[0-9]+\\.[0-9]+).*)$',
                   lambda m: m.group(1) if not re.search(r'OpenCore\\s*(?:0\\.[0-9]+|1\\.[0-9](?:\\.[0-9]+)?)',m.group(1),re.I) else m.group(1), s, flags=re.M)
          write(p,s)
          PY

          # Remove obsolete package copy step from Linux CI after Database removal.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ubuntu.yml'); s=p.read_text()
          s=s.replace('         cp -r Database bin/release/Database\n','')
          s=s.replace('         chmod +x bin/release/Database/linux/macserial\n','').replace('         chmod +x bin/release/Database/linux/ocvalidate\n','').replace('         chmod +x bin/release/Database/linux/ocpasswordgen\n','')
          p.write_text(s)
          PY

          git rm -r --ignore-unmatch Database src/dlgPreset.cpp src/dlgPreset.h src/dlgPreset.ui src/dlgdatabase.cpp src/dlgdatabase.h src/dlgdatabase.ui || true
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: remove database presets and new EFI flow'
          git push origin HEAD:refactor/remove-database-presets
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake qtbase5-dev-tools libglew-dev libglfw3-dev libxcb1 libxcb-xinerama0
          qmake
          make -j2
