name: Refactor OCAuxiliaryTools
on:
  push:
    branches: [refactor/remove-database-presets]
jobs:
  refactor:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/remove-database-presets
      - name: Apply refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('.')
          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def remove_func(src, signature):
              pos=src.find(signature)
              if pos < 0: return src
              brace=src.find('{',pos)
              if brace < 0: return src
              depth=0
              for i in range(brace,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[:pos]+src[i+1:]
              raise RuntimeError('unbalanced function: '+signature)

          # 1,4: remove Database and Presets implementation/assets.
          for p in ['src/dlgdatabase.cpp','src/dlgdatabase.h','src/dlgdatabase.ui',
                    'src/dlgPreset.cpp','src/dlgPreset.h','src/dlgPreset.ui']:
              Path(p).unlink(missing_ok=True)
          shutil.rmtree('Database', ignore_errors=True)

          # 1,2,10: remove database units/references from project and C++.
          p=Path('OCAuxiliaryTools.pro'); s=read(p)
          s=re.sub(r'^\s*src/(?:dlgPreset|dlgdatabase)\.(?:cpp|h|ui) \\\n','',s,flags=re.M)
          s=re.sub(r'^\s*src/(?:dlgPreset|dlgdatabase)\.(?:cpp|h|ui)\s*\n','',s,flags=re.M)
          write(p,s)

          p=Path('src/mainwindow.h'); s=read(p)
          for inc in ['dlgPreset.h','dlgdatabase.h','ui_dlgPreset.h','ui_dlgdatabase.h']:
              s=s.replace(f'#include "{inc}"\n','')
          s=re.sub(r'^\s*QString dataBaseDir, userDataBaseDir;\n','',s,flags=re.M)
          s=re.sub(r'^\s*QString getDatabaseVer\(\);\n','',s,flags=re.M)
          s=re.sub(r'^\s*dlgDatabase\* myDatabase;\n','',s,flags=re.M)
          s=re.sub(r'^\s*dlgPreset\* dlgPresetValues;\n','',s,flags=re.M)
          s=re.sub(r'^\s*void ShowAutoUpdateDlg\(bool\s+Database\);\n','',s,flags=re.M)
          for fn in ['on_actionDatabase_triggered','on_actionGenerateEFI_triggered']:
              s=re.sub(r'^\s*void '+fn+r'\(\);\n','',s,flags=re.M)
          write(p,s)

          p=Path('src/mainwindow.cpp'); s=read(p)
          s=s.replace('#include "dlgdatabase.h"\n','').replace('#include "dlgPreset.h"\n','')
          for sig in ['void MainWindow::on_actionDatabase_triggered()',
                      'void MainWindow::on_actionGenerateEFI_triggered()',
                      'QString MainWindow::getDatabaseVer()']:
              s=remove_func(s,sig)
          s=re.sub(r'^\s*dataBaseDir\s*=.*;\n','',s,flags=re.M)
          s=re.sub(r'^\s*userDataBaseDir\s*=.*;\n','',s,flags=re.M)
          s=s.replace('ShowAutoUpdateDlg(true);','')
          write(p,s)

          # 3,4,5: remove Database, Preset and Generate EFI actions from Qt Designer XML.
          p=Path('src/mainwindow.ui'); s=read(p)
          for obj in ['actionDatabase','actionGenerateEFI','actionPreset','actionPresets','actionGenerate_EFI']:
              s=re.sub(r'<action>\s*<property name="objectName">\s*<cstring>'+re.escape(obj)+r'</cstring>.*?</action>\s*','',s,flags=re.S)
              s=re.sub(r'\s*<addaction name="'+re.escape(obj)+r'"/>','',s)
          write(p,s)

          # 6: OpenCore selector starts at 1.0.5 and never generates older versions.
          p=Path('src/syncocdialog.cpp'); s=read(p)
          start=s.find('ui->comboOCVersions->addItems(QStringList()')
          if start>=0:
              end=s.find(');',start)
              if end>=0: s=s[:start]+'ui->comboOCVersions->addItems(QStringList() << tr("Latest Version") << "1.0.5");'+s[end+2:]
          s=s.replace('Reg.value("maxVer", "0.7.8")','Reg.value("maxVer", "1.0.5")')
          s=s.replace('QString str0 = "061";','QString str0 = "104";')

          # 7: Sync against the currently opened EFI. Downloaded archives are the temporary source.
          s=s.replace('  QString pathOldSource;\n  pathOldSource = QDir::homePath() + "/.ocat/Database/";\n','')
          s=s.replace('sourceKexts.append(pathOldSource + "EFI/OC/Kexts/" + strKextName);','sourceKexts.append(DirName + "/OC/Kexts/" + strKextName);')
          s=s.replace('sourceResourcesDir = pathOldSource + "EFI/OC/Resources/";','sourceResourcesDir = DirName + "/OC/Resources/";')
          # All pre-download sourceOpenCore entries must point at existing EFI; Method replaces them after download.
          s=s.replace('file1 = mw_one->pathSource + "EFI/OC/OpenCore.efi";','file1 = DirName + "/OC/OpenCore.efi";')
          s=s.replace('file2 = mw_one->pathSource + "EFI/BOOT/BOOTx64.efi";','file2 = DirName + "/BOOT/BOOTx64.efi";')
          s=s.replace('file3 = mw_one->pathSource + "EFI/OC/Drivers/OpenRuntime.efi";','file3 = DirName + "/OC/Drivers/OpenRuntime.efi";')
          s=s.replace('file4 = mw_one->pathSource + "EFI/OC/Drivers/OpenCanopy.efi";','file4 = DirName + "/OC/Drivers/OpenCanopy.efi";')
          s=s.replace('str2 = mw_one->pathSource + "EFI/OC/Drivers/" + str1;','str2 = DirName + "/OC/Drivers/" + str1;')
          s=s.replace('sourceOpenCore.append(mw_one->pathSource + "EFI/OC/Tools/" + strName);','sourceOpenCore.append(DirName + "/OC/Tools/" + strName);')
          s=s.replace('targetResourcesDir = DirName + "/OC/Resources/";','targetResourcesDir = DirName + "/OC/Resources/";')
          write(p,s)

          # 7: add the selected EFI root to the dialog state.
          p=Path('src/syncocdialog.h'); s=read(p)
          s=s.replace('  QString sourceResourcesDir;\n','  QString efiRoot;\n  QString sourceResourcesDir;\n')
          write(p,s)
          p=Path('src/syncocdialog.cpp'); s=read(p)
          s=s.replace('  DirName = fi.path().mid(0, fi.path().count() - 3);','  DirName = fi.path().mid(0, fi.path().count() - 3);\n  efiRoot = DirName;')
          write(p,s)

          # Method: remove database includes and replace the two database-backed update routines.
          p=Path('src/Method.cpp'); s=read(p)
          s=s.replace('#include "dlgdatabase.h"\n','').replace('#include "ui_dlgdatabase.h"\n','')
          s=s.replace('extern QString SaveFileName, strIniFile, strAppName, strAppExePath;','extern QString SaveFileName, strIniFile, strAppName, strAppExePath;')

          new_finish=r'''void Method::finishKextUpdate(bool) {
  QStringList downloaded;
  QStringList roots = DirToFileList(tempDir, "*.kext");
  for (const QString &n : roots) downloaded << tempDir + n;
  QStringList folds;
  getAllFolds(tempDir, folds);
  for (const QString &d : folds) {
    if (d.contains("Debug")) continue;
    QStringList ks = DirToFileList(d, "*.kext");
    for (const QString &n : ks) downloaded << d + "/" + n;
  }
  for (int i=0; i<downloaded.count(); ++i) {
    QString src=downloaded.at(i);
    QString name=getFileName(src);
    for (int j=0; j<mw_one->dlgSyncOC->sourceKexts.count(); ++j) {
      QString wanted=QFileInfo(mw_one->dlgSyncOC->targetKexts.at(j)).fileName();
      if (name==wanted && mw_one->dlgSyncOC->chkList.at(j)->isChecked()) {
        mw_one->copyDirectoryFiles(src, mw_one->dlgSyncOC->targetKexts.at(j), true);
      }
    }
  }
  mw_one->dlgSyncOC->ui->btnCheckUpdate->setEnabled(true);
  mw_one->dlgSyncOC->ui->labelShowDLInfo->setVisible(false);
  mw_one->checkFiles(mw_one->ui->table_kernel_add);
  mw_one->repaint();
}
'''
          s=remove_func(s,'void Method::finishKextUpdate(bool blDatabase)')
          insert=s.find('void Method::kextUpdate()')
          s=s[:insert]+new_finish+'\n'+s[insert:] if insert>=0 else s
          s=s.replace('finishKextUpdate(true);','finishKextUpdate(false);')

          new_update=r'''void Method::updateOpenCore() {
  if (!mw_one->dlgSyncOC->isCheckOC) return;
  QString extracted = tempDir + "X64/EFI/";
  QString tempBak = tempDir;
  if (!QDir(extracted).exists()) {
    QString d = filename;
    d.replace(".zip", "");
    extracted = tempDir + d + "/X64/EFI/";
    if (QDir(extracted).exists()) tempDir = tempDir + d + "/";
  }
  if (!QDir(extracted).exists()) {
    tempDir=tempBak;
    QMessageBox::information(this,"",tr("No OpenCore EFI was found in the downloaded archive."));
    return;
  }
  QString target=mw_one->dlgSyncOC->efiRoot;
  if (target.isEmpty()) { tempDir=tempBak; return; }
  QStringList selected;
  for (int i=0;i<mw_one->dlgSyncOC->ui->listOpenCore->count();++i)
    if (mw_one->dlgSyncOC->ui->listOpenCore->item(i)->checkState()==Qt::Checked)
      selected << mw_one->dlgSyncOC->ui->listOpenCore->item(i)->text();
  QStringList pairs;
  pairs << "OC/OpenCore.efi" << "BOOT/BOOTx64.efi" << "OC/Drivers/OpenRuntime.efi" << "OC/Drivers/OpenCanopy.efi";
  for (int i=0;i<pairs.count() && i<mw_one->dlgSyncOC->targetOpenCore.count();++i) {
    QString src=extracted+pairs.at(i), dst=target+"/"+pairs.at(i);
    if (QFile(src).exists()) mw_one->copyFileToPath(src,dst,true);
  }
  mw_one->copyDirectoryFiles(extracted+"OC/Drivers",target+"/OC/Drivers",true);
  mw_one->copyDirectoryFiles(extracted+"OC/Tools",target+"/OC/Tools",true);
  if (mw_one->dlgSyncOC->ui->chkIncludeResource->isChecked())
    mw_one->copyDirectoryFiles(extracted+"OC/Resources",target+"/OC/Resources",true);
  QSettings settings(strIniFile,QSettings::IniFormat);
  QString ver=filename;
  QStringList parts=ver.split("-");
  if (parts.count()>=2) {
    QString v=parts.at(1);
    if (parts.count()>=3 && !parts.at(2).contains("RELEASE") && !parts.at(2).contains("DEBUG")) v += " " + parts.at(2);
    if (v < "1.0.5") v="1.0.5";
    if (!blDEV) { settings.setValue("ocVer",v); ocVer=v; if (mw_one->dlgSyncOC->ui->comboOCVersions->currentIndex()==0) settings.setValue("maxVer",v); }
    else { settings.setValue("ocVerDev",v); ocVerDev=v; }
  }
  mw_one->dlgSyncOC->isCheckOC=false;
  mw_one->dlgSyncOC->ui->btnGetOC->setEnabled(true);
  mw_one->dlgSyncOC->ui->btnGetLastOC->setEnabled(true);
  mw_one->dlgSyncOC->init_Sync_OC_Table();
  tempDir=tempBak;
}
'''
          s=remove_func(s,'void Method::updateOpenCore()')
          insert=s.find('void Method::doProcessDownloadProgress')
          s=s[:insert]+new_update+'\n'+s[insert:] if insert>=0 else s
          write(p,s)

          # 10: remove database wording and strDatabaseUrl if present anywhere in source/UI/resources.
          for p in list(root.rglob('*')):
              if p.is_file() and p.suffix in {'.cpp','.h','.ui','.pro','.qrc','.txt'}:
                  try: s=read(p)
                  except: continue
                  ns=re.sub(r'(?i)strDatabaseUrl','',s)
                  ns=re.sub(r'(?i)OpenCore database upgrade','OpenCore update',ns)
                  ns=re.sub(r'(?i)database upgrade','update',ns)
                  if ns!=s: write(p,ns)

          # 11: Auto Column Width default false (both common Qt setting forms).
          for p in [Path('src/dlgpreference.cpp'),Path('src/mainwindow.cpp')]:
              s=read(p)
              s=re.sub(r'(Auto.?Column.?Width[^\n]{0,200}?setChecked\()true(\))',r'\1false\2',s,flags=re.I)
              s=re.sub(r'(Auto.?Column.?Width[^\n]{0,200}?[,=]\s*)true\b',r'\1false',s,flags=re.I)
              write(p,s)

          # CI: no longer package Database.
          for p in root.glob('.github/workflows/*.yml'):
              s=read(p)
              s=re.sub(r'^.*Database.*\n','',s,flags=re.M)
              write(p,s)
          PY

          # Remove temporary database/preset files if any remain and compile.
          git rm -r --ignore-unmatch Database src/dlgPreset.cpp src/dlgPreset.h src/dlgPreset.ui src/dlgdatabase.cpp src/dlgdatabase.h src/dlgdatabase.ui || true
          if git grep -n -E 'dlgDatabase|dlgPreset|dataBaseDir|userDataBaseDir|strDatabaseUrl|actionDatabase|actionGenerateEFI' -- ':!\.github/workflows/refactor.yml'; then
            echo 'Obsolete Database/Preset references remain'; exit 1
          fi
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: remove database presets and update existing EFI'
            git push origin HEAD:refactor/remove-database-presets
          fi
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake qtbase5-dev-tools libglew-dev libglfw3-dev libxcb1 libxcb-xinerama0 unzip
          qmake
          make -j2
          git rm --ignore-unmatch .github/workflows/refactor.yml || true
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore: remove temporary refactor workflow'; git push origin HEAD:refactor/remove-database-presets; fi
