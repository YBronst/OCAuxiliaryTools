name: Apply requested refactor
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  refactor:
    if: github.event.pull_request.head.ref == 'refactor/remove-database-presets' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/remove-database-presets
      - name: Refactor source tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          def R(p): return Path(p).read_text()
          def W(p,s): Path(p).write_text(s)
          def rmfunc(s,sig):
            pos=s.find(sig)
            if pos<0:return s
            b=s.find('{',pos); d=0
            for i in range(b,len(s)):
              if s[i]=='{':d+=1
              elif s[i]=='}':
                d-=1
                if d==0:return s[:pos]+s[i+1:]
            raise RuntimeError(sig)

          for p in ['src/dlgdatabase.cpp','src/dlgdatabase.h','src/dlgdatabase.ui','src/dlgPreset.cpp','src/dlgPreset.h','src/dlgPreset.ui']:
            Path(p).unlink(missing_ok=True)
          shutil.rmtree('Database',ignore_errors=True)

          p='OCAuxiliaryTools.pro';s=R(p)
          s=re.sub(r'^\s*src/(?:dlgPreset|dlgdatabase)\.(?:cpp|h|ui) \\\n','',s,flags=re.M)
          W(p,s)

          p='src/mainwindow.h';s=R(p)
          for x in ['dlgPreset.h','dlgdatabase.h','ui_dlgPreset.h','ui_dlgdatabase.h']:s=s.replace('#include "'+x+'"\n','')
          for pat in [r'^\s*QString dataBaseDir, userDataBaseDir;\n',r'^\s*QString getDatabaseVer\(\);\n',r'^\s*dlgDatabase\* myDatabase;\n',r'^\s*dlgPreset\* dlgPresetValues;\n',r'^\s*void ShowAutoUpdateDlg\(bool\s+Database\);\n'] : s=re.sub(pat,'',s,flags=re.M)
          for fn in ['on_actionDatabase_triggered','on_actionGenerateEFI_triggered']:s=re.sub(r'^\s*void '+fn+r'\(\);\n','',s,flags=re.M)
          W(p,s)

          p='src/mainwindow.cpp';s=R(p)
          s=s.replace('#include "dlgdatabase.h"\n','').replace('#include "dlgPreset.h"\n','')
          for sig in ['void MainWindow::on_actionDatabase_triggered()','void MainWindow::on_actionGenerateEFI_triggered()','QString MainWindow::getDatabaseVer()']:s=rmfunc(s,sig)
          s=re.sub(r'^\s*(?:dataBaseDir|userDataBaseDir)\s*=.*;\n','',s,flags=re.M)
          s=s.replace('ShowAutoUpdateDlg(true);','')
          W(p,s)

          p='src/mainwindow.ui';s=R(p)
          for obj in ['actionDatabase','actionGenerateEFI','actionPreset','actionPresets','actionGenerate_EFI']:
            s=re.sub(r'<action>\s*<property name="objectName">\s*<cstring>'+obj+r'</cstring>.*?</action>\s*','',s,flags=re.S)
            s=re.sub(r'\s*<addaction name="'+obj+r'"/>','',s)
          W(p,s)

          p='src/syncocdialog.h';s=R(p)
          if 'QString efiRoot;' not in s:s=s.replace('  QString sourceResourcesDir;\n','  QString efiRoot;\n  QString sourceResourcesDir;\n')
          W(p,s)
          p='src/syncocdialog.cpp';s=R(p)
          a=s.find('ui->comboOCVersions->addItems(QStringList()')
          if a>=0:
            b=s.find(');',a)
            if b>=0:s=s[:a]+'ui->comboOCVersions->addItems(QStringList() << tr("Latest Version") << "1.0.5");'+s[b+2:]
          s=s.replace('Reg.value("maxVer", "0.7.8")','Reg.value("maxVer", "1.0.5")').replace('QString str0 = "061";','QString str0 = "104";')
          s=s.replace('  QString pathOldSource;\n  pathOldSource = QDir::homePath() + "/.ocat/Database/";\n','')
          s=s.replace('DirName = fi.path().mid(0, fi.path().count() - 3);','DirName = fi.path().mid(0, fi.path().count() - 3);\n  efiRoot = DirName;')
          s=s.replace('sourceKexts.append(pathOldSource + "EFI/OC/Kexts/" + strKextName);','sourceKexts.append(DirName + "/OC/Kexts/" + strKextName);').replace('sourceResourcesDir = pathOldSource + "EFI/OC/Resources/";','sourceResourcesDir = DirName + "/OC/Resources/";')
          for x,y in [('file1 = mw_one->pathSource + "EFI/OC/OpenCore.efi";','file1 = DirName + "/OC/OpenCore.efi";'),('file2 = mw_one->pathSource + "EFI/BOOT/BOOTx64.efi";','file2 = DirName + "/BOOT/BOOTx64.efi";'),('file3 = mw_one->pathSource + "EFI/OC/Drivers/OpenRuntime.efi";','file3 = DirName + "/OC/Drivers/OpenRuntime.efi";'),('file4 = mw_one->pathSource + "EFI/OC/Drivers/OpenCanopy.efi";','file4 = DirName + "/OC/Drivers/OpenCanopy.efi";'),('str2 = mw_one->pathSource + "EFI/OC/Drivers/" + str1;','str2 = DirName + "/OC/Drivers/" + str1;'),('sourceOpenCore.append(mw_one->pathSource + "EFI/OC/Tools/" + strName);','sourceOpenCore.append(DirName + "/OC/Tools/" + strName);')]:s=s.replace(x,y)
          W(p,s)

          p='src/Method.cpp';s=R(p).replace('#include "dlgdatabase.h"\n','').replace('#include "ui_dlgdatabase.h"\n','')
          s=rmfunc(s,'void Method::finishKextUpdate(bool blDatabase)')
          s=rmfunc(s,'void Method::updateOpenCore()')
          pos=s.find('void Method::kextUpdate()')
          s=s[:pos]+'''void Method::finishKextUpdate(bool) {\n  QStringList files;\n  for (const QString &n : DirToFileList(tempDir, "*.kext")) files << tempDir+n;\n  QStringList dirs; getAllFolds(tempDir, dirs);\n  for (const QString &d : dirs) if (!d.contains("Debug")) for (const QString &n : DirToFileList(d,"*.kext")) files << d+"/"+n;\n  for (const QString &src : files) { QString name=getFileName(src); for (int i=0;i<mw_one->dlgSyncOC->targetKexts.count();++i) if (name==QFileInfo(mw_one->dlgSyncOC->targetKexts.at(i)).fileName() && mw_one->dlgSyncOC->chkList.at(i)->isChecked()) mw_one->copyDirectoryFiles(src,mw_one->dlgSyncOC->targetKexts.at(i),true); }\n  mw_one->dlgSyncOC->ui->btnCheckUpdate->setEnabled(true); mw_one->dlgSyncOC->ui->labelShowDLInfo->setVisible(false); mw_one->checkFiles(mw_one->ui->table_kernel_add); mw_one->repaint();\n}\n\n'''+s[pos:]
          s=s.replace('finishKextUpdate(true);','finishKextUpdate(false);')
          pos=s.find('void Method::doProcessDownloadProgress')
          s=s[:pos]+'''void Method::updateOpenCore() {\n  if (!mw_one->dlgSyncOC->isCheckOC) return;\n  QString root=tempDir+"X64/EFI/",bak=tempDir;\n  if (!QDir(root).exists()) { QString d=filename; d.replace(".zip",""); root=tempDir+d+"/X64/EFI/"; if (QDir(root).exists()) tempDir+=d+"/"; }\n  if (!QDir(root).exists()) { tempDir=bak; return; }\n  QString target=mw_one->dlgSyncOC->efiRoot; if (target.isEmpty()) { tempDir=bak; return; }\n  for (const QString &rel : QStringList()<<"OC/OpenCore.efi"<<"BOOT/BOOTx64.efi"<<"OC/Drivers/OpenRuntime.efi"<<"OC/Drivers/OpenCanopy.efi") if (QFile(root+rel).exists()) mw_one->copyFileToPath(root+rel,target+"/"+rel,true);\n  mw_one->copyDirectoryFiles(root+"OC/Drivers",target+"/OC/Drivers",true); mw_one->copyDirectoryFiles(root+"OC/Tools",target+"/OC/Tools",true);\n  if (mw_one->dlgSyncOC->ui->chkIncludeResource->isChecked()) mw_one->copyDirectoryFiles(root+"OC/Resources",target+"/OC/Resources",true);\n  mw_one->dlgSyncOC->isCheckOC=false; mw_one->dlgSyncOC->ui->btnGetOC->setEnabled(true); mw_one->dlgSyncOC->ui->btnGetLastOC->setEnabled(true); mw_one->dlgSyncOC->init_Sync_OC_Table(); tempDir=bak;\n}\n\n'''+s[pos:]
          W(p,s)

          for p in [Path('src/dlgpreference.cpp'),Path('src/mainwindow.cpp')]:
            s=R(p);s=re.sub(r'(Auto.?Column.?Width[^\n]{0,200}?setChecked\()true(\))',r'\1false\2',s,flags=re.I);W(p,s)
          PY
          git rm -r --ignore-unmatch Database src/dlgPreset.cpp src/dlgPreset.h src/dlgPreset.ui src/dlgdatabase.cpp src/dlgdatabase.h src/dlgdatabase.ui
          git add -A
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: remove database presets and update existing EFI' || true
          git push origin HEAD:refactor/remove-database-presets
